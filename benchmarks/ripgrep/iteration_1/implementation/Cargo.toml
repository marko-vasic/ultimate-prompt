[workspace]
members = [
    "crates/globset",
    "crates/grep-matcher",
    "crates/grep-regex",
    "crates/grep-searcher",
    "crates/grep-printer",
    "crates/grep-cli",
    "crates/ignore",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Unlicense OR MIT"
repository = "https://github.com/BurntSushi/ripgrep"

[package]
name = "ripgrep"
version = "14.1.1"
edition.workspace = true
rust-version.workspace = true
description = "ripgrep is a line-oriented search tool that recursively searches the current directory for a regex pattern while respecting gitignore rules."
default-run = "rg"

[[bin]]
name = "rg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bstr = "1"
grep-matcher = { path = "crates/grep-matcher" }
grep-regex = { path = "crates/grep-regex" }
grep-searcher = { path = "crates/grep-searcher" }
grep-printer = { path = "crates/grep-printer" }
grep-cli = { path = "crates/grep-cli" }
globset = { path = "crates/globset" }
ignore = { path = "crates/ignore" }
lexopt = "0.3"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
termcolor = "1"
textwrap = { version = "0.16", default-features = false }

[target.'cfg(all(target_env = "musl", target_pointer_width = "64"))'.dependencies]
jemallocator = "0.5"

[features]
default = []
pcre2 = ["grep-regex/pcre2"]

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
